# Production deployment.
# Run:  WEBGATE_SECRET_KEY=$(openssl rand -hex 32) docker compose up -d
# Then open http://localhost:8443/  (login: admin / admin → first-run password change)
#
# Most settings live in the app, under Admin → Settings: session recording, LDAP,
# host key verification, transfer limits, the status monitor. They take effect without
# a restart, so there is nothing to uncomment here for them.
#
# These four are read before the app can serve a request, so they stay here:
#   WEBGATE_DB_URL=postgresql+asyncpg://...  → PostgreSQL instead of SQLite
#   WEBGATE_ROOT_PATH                        → serve under a sub-path
#   WEBGATE_DEMO_MODE                        → public read-only demo
#   WEBGATE_RECORDINGS_DIR                   → where .cast files are written
# See README "Configuration" for why, and the full list.

services:
  webgate:
    image: kalexnolasco/webgate:latest
    container_name: webgate
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - webgate-data:/data
    environment:
      WEBGATE_SECRET_KEY: "${WEBGATE_SECRET_KEY:?set with: export WEBGATE_SECRET_KEY=$(openssl rand -hex 32)}"
      WEBGATE_FIRST_RUN: "true"
      # WEBGATE_RECORD_SESSIONS: "true"
      # WEBGATE_RECORDINGS_DIR: "/data/recordings"

volumes:
  webgate-data:

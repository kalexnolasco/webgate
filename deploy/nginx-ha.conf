# nginx HA config for compose.ha.yml
#
# ip_hash is the minimum needed for WebSocket affinity without a shared
# session store — all requests from the same source IP always hit the
# same upstream. Good enough for this reference setup; in a real cluster
# swap for sticky cookies via nginx Plus or Traefik.

upstream webgate_cluster {
    ip_hash;
    server webgate-1:8443 max_fails=3 fail_timeout=10s;
    server webgate-2:8443 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    # Terminal WebSocket — needs long timeouts and Upgrade passthrough.
    location /api/ws/ {
        proxy_pass http://webgate_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://webgate_cluster;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }
}

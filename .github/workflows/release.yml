name: Release

# Cutting a release is `git tag vX.Y.Z && git push origin vX.Y.Z`. Everything after
# that happens here, because doing it by hand is how PyPI and Docker Hub ended up
# three minor versions behind the repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v2.2.0"
        required: true

permissions:
  contents: read

jobs:
  # Nothing is published before the version agrees with itself and the tests pass.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_latest: ${{ steps.v.outputs.is_latest }}
      docker_tags: ${{ steps.v.outputs.docker_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: v
        name: The tag, VERSION and pyproject must agree
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          file="$(cat VERSION)"
          proj="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "tag=$version  VERSION=$file  pyproject=$proj"
          [ "$version" = "$file" ] || { echo "tag does not match VERSION"; exit 1; }
          [ "$version" = "$proj" ] || { echo "tag does not match pyproject.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Republishing an older tag is something RELEASING.md tells you to do, and it
          # must not drag `latest`, the GitHub release badge or the demo back with it.
          git fetch --tags --quiet
          newest="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          image="kalexnolasco/webgate"
          if [ "$version" = "$newest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            printf 'docker_tags<<EOF\n%s:%s\n%s:latest\nEOF\n' "$image" "$version" "$image" >> "$GITHUB_OUTPUT"
            echo "newest tag: latest will point here"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            printf 'docker_tags<<EOF\n%s:%s\nEOF\n' "$image" "$version" >> "$GITHUB_OUTPUT"
            echo "newest tag is $newest: leaving latest, the release badge and the demo alone"
          fi

      - uses: astral-sh/setup-uv@v5
      - name: The changelog has an entry for it
        run: uv run python scripts/release_notes.py "${{ steps.v.outputs.version }}" > /dev/null

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: [verify, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/webgate/${{ needs.verify.outputs.version }}
    permissions:
      id-token: write     # trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.verify.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep the Docker Hub description in step with the README
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kalexnolasco/webgate
          readme-filepath: ./README.md

  github_release:
    needs: [verify, pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5

      - name: Notes come from CHANGELOG.md, not a second description of the same release
        run: uv run python scripts/release_notes.py "${{ needs.verify.outputs.version }}" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: v${{ needs.verify.outputs.version }}
          body_path: notes.md
          make_latest: ${{ needs.verify.outputs.is_latest }}

  demo:
    needs: [verify, github_release]
    # Deploying an older tag over a newer demo would be a downgrade nobody asked for.
    if: needs.verify.outputs.is_latest == 'true'
    uses: ./.github/workflows/demo.yml
    secrets: inherit

[project]
name = "webgate"
version = "0.3.3"
description = "Self-hosted web application for remote server management via SSH terminal and SFTP file browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kevin Nolasco", email = "kalex.nolasco@gmail.com" }]
keywords = ["ssh", "sftp", "terminal", "web", "server-management", "fastapi", "asyncssh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncssh>=2.18.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.21.0",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "cryptography>=44.0.0",
    "websockets>=14.0",
    "slowapi>=0.1.9",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/kalexnolasco/webgate"
Documentation = "https://kalexnolasco.github.io/webgate/"
Repository = "https://github.com/kalexnolasco/webgate"
Changelog = "https://github.com/kalexnolasco/webgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/kalexnolasco/webgate/issues"

[project.scripts]
webgate = "webgate.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webgate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.389",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "coverage>=7.6.0",
    "mkdocs-material>=9.7.6",
    "mkdocstrings>=1.0.3",
    "mkdocstrings-python>=2.0.3",
]

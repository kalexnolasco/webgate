# Local development with a sandboxed SSH server pre-built into the network.
# Run:  docker compose -f compose.dev.yml up --build
# Open: http://localhost:8443/  (login: admin / admin → first-run password change)
#
# Inside the UI, register the dev SSH server with:
#   hostname: ssh-demo  port: 22  username: demo  password: demo

services:
  webgate:
    build: .
    container_name: webgate
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - webgate-data:/data
    environment:
      WEBGATE_SECRET_KEY: "dev-secret-key-not-for-production"
      WEBGATE_FIRST_RUN: "true"
      WEBGATE_RECORD_SESSIONS: "true"
      WEBGATE_RECORDINGS_DIR: "/data/recordings"
    depends_on:
      - ssh-demo

  ssh-demo:
    build:
      context: .
      dockerfile: Dockerfile.ssh-demo
    container_name: ssh-demo
    hostname: demo-server

volumes:
  webgate-data:
